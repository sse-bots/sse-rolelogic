services:
  - type: web
    name: sse-bots
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ACTIVATION_KEY
        sync: false
      - key: HUB_ID
        value: false
      - key: PYTHON_VERSON
        value: 3.11.9
